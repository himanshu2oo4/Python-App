name: CI pipeline
on: 
    push: 
        branches: 
            - main
        paths-ignore:
            - 'charts/**/values.yaml'
    workflow_dispatch: 
permissions: 
    contents: write 
jobs: 
    docker: 
        runs-on: ubuntu-latest 
        steps: 
            - uses: actions/checkout@v4
              with: 
                token: ${{ secrets.GT_TOKEN }}
            - name: Login to Dockerhub 
              uses: docker/login-action@v4
              with: 
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with: 
                push: true 
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ github.sha }}
            

            - name: Update image tag in values.yaml of helm 
              run: |
                sed -i "s|^\(\s*tag:\s*\).*|\1\"${{ github.sha }}\"|" charts/python-app/values.yaml
                git config user.name "github-actions"
                git config user.email "github-actions@github.com"
                git add charts/python-app/values.yaml
                git commit -m "ci: update image tag to ${{ github.sha }}"
                git push