# through this i can use this repo content => python app as a backstage component 
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: python-app
  description: A python app to display time 
  # Example for optional annotations
  annotations:
    github.com/project-slug: backstage/backstage
    backstage.io/techdocs-ref: dir:.                         # to refer the docs | make sure your folder is named as docs and in the current directory 
spec:
  type: service 
  owner: development          # we'll create this group 
  lifecycle: experimental